spring.application.name=toolbox.api
# Conexão com o PostgreSQL do Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/toolbox_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# O Hibernate criará as tabelas sozinho
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limite para permitir upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB