<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwissToolbox Web Client</title>
    <style>
        :root {
          --bg: #0f172a;
          --card-bg: #1e293b;
          --primary: #3b82f6;
          --primary-hover: #2563eb;
          --text: #f8fafc;
          --text-muted: #94a3b8;
          --border: #334155;
          --error: #ef4444;
          --success: #10b981;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
          background-color: var(--bg);
          color: var(--text);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 2.5rem 1rem;
        }

        header {
          text-align: center;
          margin-bottom: 2rem;
        }

        header h1 {
          font-size: 2rem;
          letter-spacing: -0.5px;
          margin-bottom: 0.5rem;
        }

        header p {
          color: var(--text-muted);
          font-size: 0.95rem;
        }

        .card {
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          width: 100%;
          max-width: 520px;
          padding: 1.5rem;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .tabs {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.5rem;
          background: #0b1120;
          padding: 4px;
          border-radius: 8px;
          margin-bottom: 1.5rem;
        }

        .tab-btn {
          background: transparent;
          border: none;
          color: var(--text-muted);
          font-weight: 600;
          font-size: 0.9rem;
          padding: 0.6rem;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.2s;
        }

        .tab-btn.active {
          background: var(--card-bg);
          color: var(--text);
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .tab-panel {
          display: none;
          flex-direction: column;
          gap: 1.25rem;
        }

        .tab-panel.active {
          display: flex;
        }

        .form-group {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
        }

        label {
          font-size: 0.85rem;
          font-weight: 500;
          color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
          background: #0f172a;
          border: 1px solid var(--border);
          color: var(--text);
          padding: 0.65rem 0.75rem;
          border-radius: 6px;
          font-size: 0.95rem;
          outline: none;
          transition: border-color 0.2s;
        }

        input:focus {
          border-color: var(--primary);
        }

        .row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.75rem;
        }

        button.submit-btn {
          background: var(--primary);
          color: #fff;
          font-weight: 600;
          border: none;
          padding: 0.75rem;
          border-radius: 6px;
          cursor: pointer;
          font-size: 0.95rem;
          transition: background 0.2s;
        }

        button.submit-btn:hover {
          background: var(--primary-hover);
        }

        button.submit-btn:disabled {
          opacity: 0.6;
          cursor: not-allowed;
        }

        .result-container {
          display: none;
          margin-top: 1rem;
          padding: 1rem;
          border-radius: 8px;
          background: #0f172a;
          border: 1px solid var(--border);
          text-align: center;
        }

        .result-container img {
          max-width: 100%;
          height: auto;
          border-radius: 6px;
          margin-bottom: 0.75rem;
        }

        .download-link {
          display: inline-block;
          color: var(--primary);
          font-weight: 500;
          text-decoration: none;
          font-size: 0.9rem;
        }

        .download-link:hover {
          text-decoration: underline;
        }

        .status-msg {
          font-size: 0.85rem;
          margin-top: 0.5rem;
        }

        .status-msg.error {
          color: var(--error);
        }

        .status-msg.success {
          color: var(--success);
        }
    </style>
</head>
<body>

<header>
    <h1>Toolbox</h1>
    <p>Painel de teste integrado para os microsserviços utilitários</p>
</header>

<div class="card">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pdf')">Imagem para PDF</button>
        <button class="tab-btn" onclick="switchTab('qrcode')">Gerador QR Code</button>
    </div>

    <!-- PAINEL 1: IMAGEM PARA PDF -->
    <div id="panel-pdf" class="tab-panel active">
        <div class="form-group">
            <label for="imageFileInput">Selecione uma imagem (PNG ou JPEG):</label>
            <input type="file" id="imageFileInput" accept="image/png, image/jpeg" />
        </div>

        <button class="submit-btn" id="pdfBtn" onclick="convertImageToPdf()">Converter e Baixar PDF</button>
        <div id="pdfStatus" class="status-msg"></div>
    </div>

    <!-- PAINEL 2: GERADOR DE QR CODE -->
    <div id="panel-qrcode" class="tab-panel">
        <div class="form-group">
            <label for="qrText">Texto ou URL:</label>
            <input type="text" id="qrText" placeholder="Ex: https://github.com" />
        </div>

        <div class="row">
            <div class="form-group">
                <label for="qrWidth">Largura (px):</label>
                <input type="number" id="qrWidth" value="300" min="50" max="1000" />
            </div>
            <div class="form-group">
                <label for="qrHeight">Altura (px):</label>
                <input type="number" id="qrHeight" value="300" min="50" max="1000" />
            </div>
        </div>

        <button class="submit-btn" id="qrBtn" onclick="generateQrCode()">Gerar QR Code</button>
        <div id="qrStatus" class="status-msg"></div>

        <div id="qrResult" class="result-container">
            <img id="qrImage" src="" alt="QR Code gerado" />
            <div>
                <a id="qrDownload" class="download-link" href="#" download="qrcode.png">Baixar Imagem</a>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = "http://localhost:8080/api/v1";

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.remove("active"));

      if (tab === "pdf") {
        document.querySelector(".tab-btn:nth-child(1)").classList.add("active");
        document.getElementById("panel-pdf").classList.add("active");
      } else {
        document.querySelector(".tab-btn:nth-child(2)").classList.add("active");
        document.getElementById("panel-qrcode").classList.add("active");
      }
    }

    async function convertImageToPdf() {
      const fileInput = document.getElementById("imageFileInput");
      const status = document.getElementById("pdfStatus");
      const btn = document.getElementById("pdfBtn");

      status.textContent = "";
      status.className = "status-msg";

      if (!fileInput.files.length) {
        status.textContent = "Por favor, selecione uma imagem.";
        status.classList.add("error");
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);

      btn.disabled = true;
      btn.textContent = "Processando conversão...";

      try {
        const response = await fetch(`${API_BASE_URL}/conversions/image-to-pdf`, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Falha no servidor: Status ${response.status}`);
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = "documento-convertido.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        status.textContent = "PDF gerado e download iniciado!";
        status.classList.add("success");
      } catch (err) {
        status.textContent = err.message || "Erro de conexão com o backend.";
        status.classList.add("error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Converter e Baixar PDF";
      }
    }

    async function generateQrCode() {
      const text = document.getElementById("qrText").value.trim();
      const width = document.getElementById("qrWidth").value || 300;
      const height = document.getElementById("qrHeight").value || 300;
      const status = document.getElementById("qrStatus");
      const resultBox = document.getElementById("qrResult");
      const qrImg = document.getElementById("qrImage");
      const qrDownload = document.getElementById("qrDownload");
      const btn = document.getElementById("qrBtn");

      status.textContent = "";
      status.className = "status-msg";
      resultBox.style.display = "none";

      if (!text) {
        status.textContent = "Informe um texto ou URL para o QR Code.";
        status.classList.add("error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Gerando imagem...";

      try {
        const queryParams = new URLSearchParams({ text, width, height });
        const response = await fetch(`${API_BASE_URL}/qrcodes?${queryParams.toString()}`);

        if (!response.ok) {
          throw new Error(`Falha no servidor: Status ${response.status}`);
        }

        const blob = await response.blob();
        const imageUrl = window.URL.createObjectURL(blob);

        qrImg.src = imageUrl;
        qrDownload.href = imageUrl;
        resultBox.style.display = "block";

        status.textContent = "QR Code gerado com sucesso!";
        status.classList.add("success");
      } catch (err) {
        status.textContent = err.message || "Erro de conexão com o backend.";
        status.classList.add("error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Gerar QR Code";
      }
    }
</script>
</body>
</html>
